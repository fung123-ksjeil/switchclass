<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>수업이음 · 수업 교체 도우미</title><link rel="stylesheet" href="./style.css"></head><body>
<header class="compact-toolbar"><a class="brand" href="./">↔ <span>수업이음</span></a><select id="sheet" aria-label="시간표 시트"></select><input id="search" aria-label="교사 검색" placeholder="교사 검색" autocomplete="off"><button id="reset">선택 해제</button><span class="toolbar-legend"><i></i> 선택 <i class="match"></i> 교체 가능</span><label class="upload">시간표 불러오기<input type="file" id="upload" accept=".xlsx" hidden></label></header>
<main><div class="workspace"><section class="schedule panel" aria-label="전체 교사 시간표"><div class="table-wrap"><table class="all-table"><thead id="gridHead"></thead><tbody id="grid"><tr><td class="initial-empty">‘시간표 불러오기’에서 엑셀 파일을 선택하세요.</td></tr></tbody></table></div></section>
<aside class="panel results"><div class="panel-top"><div><h2>교체 추천 <span id="resultCount" class="count">0</span></h2></div></div><div id="selection"></div><div class="filter"><label><input type="checkbox" id="sameDay"> 같은 요일만 보기</label><button id="criteria">추천 기준 ⓘ</button></div><div id="criteriaText" hidden>100점에서 부담 증가를 감점합니다. 최대 연속 수업 증가 1교시당 12점(첫 1교시는 제외), 하루 5교시 초과 1교시당 6점, 하루 시수 증가 1교시당 3점. 상대 교사는 가중치 2배, 요청 교사는 1배입니다. 같은 점수는 요일·교시순입니다. 주간 총시수는 변하지 않습니다.</div><div id="results"><div class="empty"><p>교체할 수업을 클릭하세요.</p></div></div></aside></div>
<div id="status" role="status" hidden></div></main><dialog id="dialog"><h2>수업 교체 제안</h2><div id="proposal"></div><div class="dialog-actions"><button id="copy">제안 내용 복사</button><button id="close">닫기</button></div></dialog><script src="./vendor/fflate.js"></script><script src="./engine.js"></script><script src="./app.js"></script></body></html>
